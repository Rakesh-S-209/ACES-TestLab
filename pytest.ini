[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Marker declarations ──────────────────────────────────────────────────────
markers =
    unit: Fast unit tests — no I/O, no network, no real filesystem beyond tmp_path
    integration: Multi-component tests — may open loopback TCP ports or temp DBs
    security: Negative / adversarial input tests and access-control checks
    regression: Tests that reproduce documented defects (DEF-001, DEF-002, DEF-003)
    slow: Tests with many Hypothesis examples or no deadline; excluded from fast CI

# ── Logging ──────────────────────────────────────────────────────────────────
log_cli = false
log_level = WARNING

# ── Timeout (requires pytest-timeout) ────────────────────────────────────────
# timeout = 30
