[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

# ---------------------------------------------------------------------------
# Ruff — linter and formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
]
ignore = [
    "S101",   # assert statements are expected in test files
    "S311",   # standard pseudo-random not used for security here
    "E501",   # line-length handled by formatter
    "B008",   # function calls in default args (pytest fixtures)
    "N802",   # function name should be lowercase (Hypothesis test methods)
    "PT011",  # pytest.raises() match= not always required
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S108", "S603"]

# ---------------------------------------------------------------------------
# pytest-cov
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/migrations/*",
    "*/__pycache__/*",
    "*/frontend-aces/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "except ImportError",
]
# Threshold is intentionally NOT set here — it will be set after Phase 8
# baseline measurement.  Premature thresholds distort engineering judgement.

[tool.coverage.html]
directory = "reports/coverage_html"
title = "ACES Coverage Report"
